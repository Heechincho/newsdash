<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>투자지표 대시보드</title>
<style>
  :root {
    --page-bg: #f4f6fb;
    --card-bg: #ffffff;
    --border: #e7eaf3;
    --text-main: #1a2035;
    --text-sub: #8992a9;
    --blue: #2f6fed;
    --blue-soft: #eaf0fe;
    --up: #e5484d;
    --down: #2f80ed;
    --flat: #8992a9;
    --shadow: 0 2px 10px rgba(30, 41, 82, 0.06);
    --shadow-hover: 0 10px 24px rgba(30, 41, 82, 0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--page-bg);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Malgun Gothic", Arial, sans-serif;
    line-height: 1.5;
  }

  header, main, footer {
    max-width: 1100px;
    margin: 0 auto;
  }

  header {
    padding: 30px 20px 6px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-badge {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: var(--blue);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    flex-shrink: 0;
  }
  header .heading h1 {
    font-size: 21px;
    font-weight: 800;
    margin: 0 0 2px;
    color: var(--text-main);
  }
  header .heading p {
    margin: 0;
    color: var(--text-sub);
    font-size: 13px;
  }

  main {
    padding: 20px 20px 60px;
  }
  section { margin-top: 30px; }
  section h2 {
    font-size: 13px;
    letter-spacing: 0.5px;
    margin: 0 0 14px;
    color: var(--text-sub);
    text-transform: uppercase;
    font-weight: 700;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-hover);
  }
  .card .label {
    font-size: 12px;
    color: var(--text-sub);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .card .price {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 6px;
    color: var(--text-main);
  }
  .card .change {
    font-size: 12.5px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    padding: 3px 8px;
    border-radius: 999px;
  }
  .change.up { color: var(--up); background: rgba(229, 72, 77, 0.1); }
  .change.down { color: var(--down); background: rgba(47, 128, 237, 0.1); }
  .change.flat { color: var(--flat); background: rgba(137, 146, 169, 0.1); }
  .card .spark {
    display: block;
    width: 100%;
    height: 32px;
    margin-top: 10px;
  }
  .card.error { color: var(--text-sub); }
  .card.error .price {
    font-size: 14px;
    color: var(--text-sub);
    font-weight: 500;
  }

  .news-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .news-item {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    text-decoration: none;
    color: inherit;
    box-shadow: var(--shadow);
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .news-item:hover {
    border-color: var(--blue);
    transform: translateX(2px);
  }
  .news-title {
    font-size: 14px;
    flex: 1;
    min-width: 0;
    font-weight: 500;
  }
  .news-meta {
    font-size: 12px;
    color: var(--text-sub);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .status {
    text-align: center;
    color: var(--text-sub);
    padding: 40px 0;
    font-size: 14px;
  }
  footer {
    padding: 0 20px 40px;
    font-size: 12px;
    color: var(--text-sub);
  }

  @media (max-width: 480px) {
    header .heading h1 { font-size: 18px; }
    .grid { grid-template-columns: repeat(2, 1fr); }
    .card .price { font-size: 17px; }
    .news-item { flex-direction: column; gap: 4px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand-badge">◈</div>
  <div class="heading">
    <h1>투자지표 대시보드</h1>
    <p id="updatedAt">데이터 불러오는 중...</p>
  </div>
</header>

<main>
  <section>
    <h2>시장 지표</h2>
    <div id="instrumentsGrid" class="grid">
      <div class="status">불러오는 중...</div>
    </div>
  </section>

  <section>
    <h2>경제 뉴스</h2>
    <div id="newsList" class="news-list">
      <div class="status">불러오는 중...</div>
    </div>
  </section>
</main>

<footer>
  데이터 출처: Yahoo Finance(시장 지표), 연합뉴스·한국경제(RSS) · 10분마다 자동 갱신
</footer>

<script>
async function loadData() {
  try {
    const res = await fetch('data/market.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('data/market.json 을 불러올 수 없습니다.');
    const data = await res.json();
    renderUpdatedAt(data.updatedAt);
    renderInstruments(data.instruments || []);
    renderNews(data.news || []);
  } catch (err) {
    document.getElementById('updatedAt').textContent = '데이터를 불러오지 못했습니다.';
    document.getElementById('instrumentsGrid').innerHTML =
      '<div class="status">' + escapeHtml(err.message) + '</div>';
    document.getElementById('newsList').innerHTML = '';
  }
}

function renderUpdatedAt(iso) {
  const el = document.getElementById('updatedAt');
  if (!iso) { el.textContent = '업데이트 시각 정보 없음'; return; }
  const d = new Date(iso);
  const formatted = d.toLocaleString('ko-KR', {
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit',
  });
  el.textContent = '마지막 업데이트: ' + formatted + ' (한국시간)';
}

function renderInstruments(instruments) {
  const grid = document.getElementById('instrumentsGrid');
  if (!instruments.length) {
    grid.innerHTML = '<div class="status">표시할 지표가 없습니다.</div>';
    return;
  }
  grid.innerHTML = instruments.map((item) => {
    if (!item.ok) {
      return `
        <div class="card error">
          <div class="label">${escapeHtml(item.label)}</div>
          <div class="price">수집 실패</div>
        </div>`;
    }
    const changeClass = item.changePercent > 0 ? 'up' : item.changePercent < 0 ? 'down' : 'flat';
    const arrow = item.changePercent > 0 ? '▲' : item.changePercent < 0 ? '▼' : '－';
    const changeText = item.changePercent === null || item.changePercent === undefined
      ? '변동률 정보 없음'
      : `${arrow} ${Math.abs(item.changePercent).toFixed(2)}%`;
    return `
      <div class="card">
        <div class="label">${escapeHtml(item.label)}</div>
        <div class="price">${formatPrice(item.price)}</div>
        <div class="change ${changeClass}">${changeText}</div>
        ${renderSparkline(item.history, changeClass)}
      </div>`;
  }).join('');
}

function renderSparkline(history, changeClass) {
  if (!Array.isArray(history) || history.length < 2) return '';
  const w = 100, h = 32, pad = 2;
  const min = Math.min(...history);
  const max = Math.max(...history);
  const range = max - min || 1;
  const points = history.map((v, i) => {
    const x = (i / (history.length - 1)) * (w - pad * 2) + pad;
    const y = h - pad - ((v - min) / range) * (h - pad * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const stroke = changeClass === 'up' ? 'var(--up)' : changeClass === 'down' ? 'var(--down)' : 'var(--flat)';
  return `
    <svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <polyline points="${points}" fill="none" stroke="${stroke}" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round" />
    </svg>`;
}

function renderNews(news) {
  const list = document.getElementById('newsList');
  if (!news.length) {
    list.innerHTML = '<div class="status">표시할 뉴스가 없습니다.</div>';
    return;
  }
  list.innerHTML = news.map((n) => `
    <a class="news-item" href="${escapeHtml(n.link)}" target="_blank" rel="noopener noreferrer">
      <span class="news-title">${escapeHtml(n.title)}</span>
      <span class="news-meta">${escapeHtml(n.source)} · ${formatPubDate(n.pubDate)}</span>
    </a>
  `).join('');
}

function formatPrice(price) {
  if (typeof price !== 'number') return '-';
  return price.toLocaleString('en-US', { maximumFractionDigits: 2 });
}

function formatPubDate(pubDate) {
  if (!pubDate) return '';
  const d = new Date(pubDate);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

loadData();
</script>

</body>
</html>
