<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>투자지표 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08050f;
    --panel: rgba(255, 255, 255, 0.04);
    --panel-border: rgba(255, 255, 255, 0.1);
    --cyan: #00f6ff;
    --magenta: #ff2bd6;
    --purple: #9b30ff;
    --yellow: #d4ff2b;
    --text-main: #eef0ff;
    --text-sub: #8b8ba8;
    --up: #ff2bd6;
    --down: #00f6ff;
    --flat: #8b8ba8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text-main);
    font-family: 'Rajdhani', sans-serif;
    line-height: 1.5;
    overflow-x: hidden;
    position: relative;
  }

  h1, h2, .price, .amount {
    font-family: 'Orbitron', sans-serif;
  }

  /* ---------- background fx ---------- */
  .bg-grid {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image:
      linear-gradient(rgba(155, 48, 255, 0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(155, 48, 255, 0.08) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 10%, black 40%, transparent 90%);
    pointer-events: none;
  }
  .bg-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.3;
    z-index: 0;
    pointer-events: none;
  }
  .bg-orb.a { width: 460px; height: 460px; background: var(--purple); top: -160px; left: -120px; }
  .bg-orb.b { width: 420px; height: 420px; background: var(--cyan); top: 200px; right: -160px; }

  .glass {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 16px;
  }

  header, main, footer {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
  }

  header {
    padding: 34px 20px 10px;
  }
  header h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 1.5px;
    margin: 0 0 8px;
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: inline-block;
  }
  header p {
    margin: 0;
    color: var(--text-sub);
    font-size: 13px;
    letter-spacing: 0.5px;
  }

  main {
    padding: 16px 20px 60px;
  }
  section { margin-top: 34px; }
  section h2 {
    font-size: 14px;
    letter-spacing: 2px;
    margin: 0 0 16px;
    color: var(--purple);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
  }
  .card {
    padding: 18px;
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(0, 246, 255, 0.4);
    box-shadow: 0 0 24px rgba(0, 246, 255, 0.15);
  }
  .card .label {
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--text-sub);
    margin-bottom: 8px;
  }
  .card .price {
    font-size: 21px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--text-main);
  }
  .card .change {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .change.up { color: var(--up); text-shadow: 0 0 10px rgba(255, 43, 214, 0.55); }
  .change.down { color: var(--down); text-shadow: 0 0 10px rgba(0, 246, 255, 0.55); }
  .change.flat { color: var(--flat); }
  .card.error { color: var(--text-sub); }
  .card.error .price {
    font-size: 14px;
    color: var(--text-sub);
    font-weight: 400;
    font-family: 'Rajdhani', sans-serif;
  }

  .news-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .news-item {
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.2s ease, transform 0.15s ease;
  }
  .news-item:hover {
    border-color: rgba(255, 43, 214, 0.45);
    transform: translateX(2px);
  }
  .news-title {
    font-size: 14px;
    flex: 1;
    min-width: 0;
  }
  .news-meta {
    font-size: 12px;
    color: var(--text-sub);
    white-space: nowrap;
    flex-shrink: 0;
    letter-spacing: 0.5px;
  }
  .status {
    text-align: center;
    color: var(--text-sub);
    padding: 40px 0;
    font-size: 14px;
  }
  footer {
    padding: 0 20px 40px;
    font-size: 12px;
    color: var(--text-sub);
    letter-spacing: 0.5px;
  }

  @media (max-width: 480px) {
    header h1 { font-size: 20px; }
    .grid { grid-template-columns: repeat(2, 1fr); }
    .card .price { font-size: 18px; }
    .news-item { flex-direction: column; gap: 4px; }
  }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-orb a"></div>
<div class="bg-orb b"></div>

<header>
  <h1>◈ 투자지표 대시보드</h1>
  <p id="updatedAt">데이터 불러오는 중...</p>
</header>

<main>
  <section>
    <h2>▸ 시장 지표</h2>
    <div id="instrumentsGrid" class="grid">
      <div class="status">불러오는 중...</div>
    </div>
  </section>

  <section>
    <h2>▸ 경제 뉴스</h2>
    <div id="newsList" class="news-list">
      <div class="status">불러오는 중...</div>
    </div>
  </section>
</main>

<footer>
  데이터 출처: Yahoo Finance(시장 지표), 연합뉴스·한국경제(RSS) · 10분마다 자동 갱신
</footer>

<script>
async function loadData() {
  try {
    const res = await fetch('data/market.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('data/market.json 을 불러올 수 없습니다.');
    const data = await res.json();
    renderUpdatedAt(data.updatedAt);
    renderInstruments(data.instruments || []);
    renderNews(data.news || []);
  } catch (err) {
    document.getElementById('updatedAt').textContent = '데이터를 불러오지 못했습니다.';
    document.getElementById('instrumentsGrid').innerHTML =
      '<div class="status">' + escapeHtml(err.message) + '</div>';
    document.getElementById('newsList').innerHTML = '';
  }
}

function renderUpdatedAt(iso) {
  const el = document.getElementById('updatedAt');
  if (!iso) { el.textContent = '업데이트 시각 정보 없음'; return; }
  const d = new Date(iso);
  const formatted = d.toLocaleString('ko-KR', {
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit',
  });
  el.textContent = '마지막 업데이트: ' + formatted + ' (한국시간)';
}

function renderInstruments(instruments) {
  const grid = document.getElementById('instrumentsGrid');
  if (!instruments.length) {
    grid.innerHTML = '<div class="status">표시할 지표가 없습니다.</div>';
    return;
  }
  grid.innerHTML = instruments.map((item) => {
    if (!item.ok) {
      return `
        <div class="glass card error">
          <div class="label">${escapeHtml(item.label)}</div>
          <div class="price">수집 실패</div>
        </div>`;
    }
    const changeClass = item.changePercent > 0 ? 'up' : item.changePercent < 0 ? 'down' : 'flat';
    const arrow = item.changePercent > 0 ? '▲' : item.changePercent < 0 ? '▼' : '－';
    const changeText = item.changePercent === null || item.changePercent === undefined
      ? '변동률 정보 없음'
      : `${arrow} ${Math.abs(item.changePercent).toFixed(2)}%`;
    return `
      <div class="glass card">
        <div class="label">${escapeHtml(item.label)}</div>
        <div class="price">${formatPrice(item.price)}</div>
        <div class="change ${changeClass}">${changeText}</div>
      </div>`;
  }).join('');
}

function renderNews(news) {
  const list = document.getElementById('newsList');
  if (!news.length) {
    list.innerHTML = '<div class="status">표시할 뉴스가 없습니다.</div>';
    return;
  }
  list.innerHTML = news.map((n) => `
    <a class="glass news-item" href="${escapeHtml(n.link)}" target="_blank" rel="noopener noreferrer">
      <span class="news-title">${escapeHtml(n.title)}</span>
      <span class="news-meta">${escapeHtml(n.source)} · ${formatPubDate(n.pubDate)}</span>
    </a>
  `).join('');
}

function formatPrice(price) {
  if (typeof price !== 'number') return '-';
  return price.toLocaleString('en-US', { maximumFractionDigits: 2 });
}

function formatPubDate(pubDate) {
  if (!pubDate) return '';
  const d = new Date(pubDate);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

loadData();
</script>

</body>
</html>
